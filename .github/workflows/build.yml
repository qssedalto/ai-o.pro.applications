name: macOS build
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build and package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AI-O-Studio-macOS
          path: dist/AI-O-Studio-macOS.zip
